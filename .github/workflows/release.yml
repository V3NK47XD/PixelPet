name: Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Release from Local Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Dynamic Release Tag
        id: version_step
        run: |
          RAW_VERSION=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          BASE_VER="v${RAW_VERSION:-1.0.2}"

          # Check if tag already exists in repo
          if git rev-parse "$BASE_VER" >/dev/null 2>&1 || git ls-remote --tags origin "$BASE_VER" | grep -q "$BASE_VER"; then
            # Tag exists! Append run number so a fresh release is ALWAYS created on GitHub
            TAG_NAME="${BASE_VER}.${{ github.run_number }}"
          else
            TAG_NAME="$BASE_VER"
          fi

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "BASE_VER=$BASE_VER" >> $GITHUB_OUTPUT
          echo "Calculated Release Tag: $TAG_NAME"

      - name: Verify Prebuilt APK from Laptop
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Local prebuilt APK not found at app/build/outputs/apk/debug/app-debug.apk!"
            echo "Please run ./gradlew assembleDebug on your laptop, commit the APK, and push."
            exit 1
          fi
          echo "Verified pre-built APK from laptop is present in repository."
          ls -la app/build/outputs/apk/debug/app-debug.apk

      - name: Package Release APK
        run: |
          TAG_NAME="${{ steps.version_step.outputs.TAG_NAME }}"
          cp app/build/outputs/apk/debug/app-debug.apk "PixelPet-${TAG_NAME}.apk"
          echo "Created PixelPet-${TAG_NAME}.apk from locally signed build."
          ls -la "PixelPet-${TAG_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.TAG_NAME }}
          name: "Pixel Pet ${{ steps.version_step.outputs.TAG_NAME }} 🐣"
          body: |
            ### Pixel Pet ${{ steps.version_step.outputs.TAG_NAME }} 🐣
            
            **Cute Animated Pixel-Art Companion Tethered to Your Front Camera**
            
            *Signed with original developer certificate from local build.*
            
            #### Highlights & Features in this release:
            - **Single Verified APK Release**: Exclusively releases the locally-built, signed APK directly from the codebase (`PixelPet-${{ steps.version_step.outputs.TAG_NAME }}.apk`).
            - **Keychain Physics & Wire Shiver Ripples**: Flexible wire simulation with pendulum inertia, S-curve flex, and rapid shake shivering waves (Duolingo 2.5D style).
            - **Fluid Gyroscope & Physical Inertia**: Phone tilts swing the pet along its leash with realistic momentum; shaking injects playful rotational orbits! Settles back stably when still.
            - **Zero-Scroll All-in-One UI with Rotary Speaker Knobs**: 100% compact screen with retro rotary dials (`CAM X`, `CAM Y`, `SIZE`, `LEASH`) with tactile haptic ticks.
            - **Cute Peach & Soft Orange Theme**: Warm peach (`#FF9F68`) & creamsicle palette with separated Developer Tools sheet (⚙️).
            - **Leash-Constrained Dragging**: Drag the pet anywhere within the leash radius with elastic spring-back bounce upon release.
            - **Shape-Matched Touch Detection**: 100% of touches outside the pet pass straight through to underlying apps (e.g. Instagram Reels, status bar, navigation).
            - **Contextual App Moods**:
              - 🥺 **Sad mode on Instagram** (pale blue, trickling teardrops).
              - 😡 **Angry mode on Instagram > 5 min** (crimson red, rage vibration, rising steam puffs).
              - 💬 **Texting mode on WhatsApp/Discord/Messages/LinkedIn** (speech bubble with cycling typing dots ••• and rapid typing hands).
              - 🤓 **Nerd mode on Google Apps, ChatGPT, Gemini, WPS, PDF** (glasses drop & text reading scan).
              - 🌙 **Late-Night Sleepiness** (soft lavender, drooping eyes, yawns, Zzz).
              - 🔋 **Phone Events** (Wake-up glow, mint green charge sparkles, low battery worry, red faint).
            - **Tap Interactions**:
              - Tap sleepy pet $\to$ wakes up; tap awake pet $\to$ nods off to sleep!
              - Rapid 3+ taps $\to$ temper tantrum (furious red steam for 3.8s, then calms down).
              - Single taps $\to$ wink, wave, giggle, or adjust glasses.
            
            #### Direct APK Download:
            - **[`PixelPet-${{ steps.version_step.outputs.TAG_NAME }}.apk`](https://github.com/V3NK47XD/PixelPet/releases/download/${{ steps.version_step.outputs.TAG_NAME }}/PixelPet-${{ steps.version_step.outputs.TAG_NAME }}.apk)**
          files: |
            PixelPet-${{ steps.version_step.outputs.TAG_NAME }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
